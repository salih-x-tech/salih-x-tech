<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0e1322" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badge-border-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="badge-border-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="badge-border-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .code-accent {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        fill: #64748b;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="280" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Lighting Glows -->
  <rect width="1000" height="280" rx="16" fill="url(#glow-cyan)" />
  <rect width="1000" height="280" rx="16" fill="url(#glow-purple)" />
  <rect width="1000" height="280" rx="16" fill="url(#glow-pink)" />

  <!-- Border Outline -->
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Corner Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 975 45 L 975 25 L 955 25" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 25 235 L 25 255 L 45 255" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 975 235 L 975 255 L 955 255" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Terminal Dots -->
  <circle cx="45" cy="45" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="45" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="79" cy="45" r="5" fill="#10b981" opacity="0.8" />
  <text x="100" y="49" class="code-accent">&lt;salih-x-tech / portfolio&gt;</text>

  <!-- Status Indicator (Top Right) -->
  <circle cx="890" cy="45" r="4.5" fill="#10b981" />
  <circle cx="890" cy="45" r="9" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <text x="906" y="49" class="code-accent" fill="#10b981">ONLINE</text>

  <!-- Subtle Circuit Lines -->
  <path d="M 60 140 L 140 140 L 170 170 L 210 170" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="210" cy="170" r="3" fill="#0ea5e9" fill-opacity="0.6" />

  <path d="M 940 140 L 860 140 L 830 110 L 790 110" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="790" cy="110" r="3" fill="#a855f7" fill-opacity="0.6" />

  <!-- Main Name Title -->
  <g id="name-title">
    <text x="500" y="125" text-anchor="middle" class="title-text" fill="url(#text-grad)">SALIH HAYAT</text>
  </g>

  <!-- Subtitle -->
  <text x="500" y="165" text-anchor="middle" class="subtitle-text">
    COMPUTER SCIENCE STUDENT <tspan fill="#38bdf8">•</tspan> FULL STACK DEVELOPER <tspan fill="#818cf8">•</tspan> JAVASCRIPT DEVELOPER
  </text>

  <!-- Status / Feature Badges -->
  <g id="badges">
    <!-- Badge 1 -->
    <g transform="translate(195, 200)">
      <rect width="180" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#badge-border-1)" stroke-width="1.2" />
      <text x="90" y="21.5" text-anchor="middle" class="tag-text" fill="#38bdf8">⚡ FULL STACK DEV</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(390, 200)">
      <rect width="220" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#badge-border-2)" stroke-width="1.2" />
      <text x="110" y="21.5" text-anchor="middle" class="tag-text" fill="#c084fc">🚀 3D WEB &amp; REACT</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(625, 200)">
      <rect width="180" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#badge-border-3)" stroke-width="1.2" />
      <text x="90" y="21.5" text-anchor="middle" class="tag-text" fill="#34d399">🌱 EXPLORING AI</text>
    </g>
  </g>
</svg>
